<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 1000 300" width="1000" height="300" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .t{font-family:ui-monospace,SFMono-Regular,Consolas,Menlo,monospace;font-size:20px}
    .p{fill:#f4a261}.c{fill:#e6edf3}.d{fill:#8b949e}.a{fill:#7ee787}.b{fill:#79c0ff}
    .l{opacity:0;animation:in .3s ease forwards}
    .l1{animation-delay:.4s}.l2{animation-delay:1.2s}.l3{animation-delay:2s}.l4{animation-delay:2.8s}.l5{animation-delay:3.6s}.l6{animation-delay:4.4s}
    @keyframes in{to{opacity:1}}
    .cur{animation:blink 1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    .cat{transform:translateY(120px);animation:peek .8s ease-out 4.6s forwards}
    @keyframes peek{to{transform:translateY(0)}}
    .eye{transform-box:fill-box;transform-origin:center;animation:wink 4s 6s infinite}
    @keyframes wink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
  </style>

  <rect x="0" y="0" width="1000" height="300" rx="14" fill="#11151c"/>
  <rect x="0" y="0" width="1000" height="40" rx="14" fill="#1c222b"/>
  <rect x="0" y="26" width="1000" height="14" fill="#1c222b"/>
  <circle cx="26" cy="20" r="7" fill="#ff5f57"/><circle cx="50" cy="20" r="7" fill="#febc2e"/><circle cx="74" cy="20" r="7" fill="#28c840"/>
  <text x="500" y="26" text-anchor="middle" class="t d" font-size="15">kamal@halden: ~</text>

  <text x="36" y="82" class="t l l1"><tspan class="p">$</tspan><tspan class="c"> whoami</tspan></text>
  <text x="36" y="112" class="t l l2"><tspan class="a">Kamal</tspan><tspan class="d"> · software engineering student, Halden</tspan></text>
  <text x="36" y="152" class="t l l3"><tspan class="p">$</tspan><tspan class="c"> ls projects/</tspan></text>
  <text x="36" y="182" class="t l l4"><tspan class="b">ChessNextDoor/  Leqtio/  verkstedweb/</tspan></text>
  <text x="36" y="222" class="t l l5"><tspan class="p">$</tspan><tspan class="c"> cat co-worker.txt</tspan></text>
  <text x="36" y="252" class="t l l6"><tspan class="d">he sits on the keyboard. bugs are his.</tspan></text>
  <rect x="36" y="266" width="12" height="20" class="p cur"/>

  <g class="cat">
    <polygon points="800,215 812,160 845,198" fill="#f2c49b"/>
    <polygon points="808,205 815,175 834,198" fill="#f4a3a8"/>
    <polygon points="930,215 918,160 885,198" fill="#f2c49b"/>
    <polygon points="922,205 915,175 896,198" fill="#f4a3a8"/>
    <ellipse cx="865" cy="260" rx="78" ry="70" fill="#f2c49b"/>
    <ellipse cx="865" cy="285" rx="44" ry="30" fill="#fbe3cc"/>
    <g class="eye"><ellipse cx="837" cy="250" rx="9" ry="11" fill="#1a1a1a"/><circle cx="840" cy="246" r="3" fill="#fff"/></g>
    <g class="eye"><ellipse cx="893" cy="250" rx="9" ry="11" fill="#1a1a1a"/><circle cx="896" cy="246" r="3" fill="#fff"/></g>
    <path d="M858,272 h14 l-7,8 z" fill="#e8838c"/>
    <path d="M865,280 q-8,10 -16,4 M865,280 q8,10 16,4" stroke="#8a5a44" stroke-width="2" fill="none"/>
    <path d="M820,275 h-36 M820,283 l-34,6 M910,275 h36 M910,283 l34,6" stroke="#fbe3cc" stroke-width="2"/>
    <ellipse cx="815" cy="298" rx="20" ry="10" fill="#fbe3cc"/>
    <ellipse cx="915" cy="298" rx="20" ry="10" fill="#fbe3cc"/>
  </g>
</svg>
